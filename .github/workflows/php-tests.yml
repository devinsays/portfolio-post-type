name: PHPUnit Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php_ver }} / WP ${{ matrix.wp_ver }}${{ matrix.multisite == '1' && ' / multisite' || '' }}
    strategy:
      fail-fast: false
      matrix:
        php_ver: ["7.4", "8.3", "8.4"]
        wp_ver: ["latest"]
        multisite: ["0"]
        include:
          - php_ver: "8.4"
            wp_ver: "latest"
            multisite: "1"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the files
        uses: actions/checkout@v4

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_ver }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Start MySQL
        run: sudo /etc/init.d/mysql start

      - name: Install WordPress test suite
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root localhost ${{ matrix.wp_ver }}

      - name: Run phpunit
        run: vendor/bin/phpunit
        env:
          WP_MULTISITE: ${{ matrix.multisite }}
